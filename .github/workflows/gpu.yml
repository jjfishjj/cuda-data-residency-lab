name: NVIDIA GPU benchmark
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: nvidia-smi
      - run: docker build -t nvidia-lab/cuda .
      - run: docker run --rm --gpus all nvidia-lab/cuda 16777216 20 | tee benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-benchmark
          path: benchmark.json
